name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm pod_splitter.spec

      - name: Assemble release folder
        shell: pwsh
        run: |
          $release = "release/POD_Splitter"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item -Recurse -Force dist/POD_Splitter/* $release/
          Copy-Item -Force "packaging/Start POD Splitter.bat" $release/
          Copy-Item -Force packaging/README.txt $release/
          foreach ($dir in @("1_Input", "2_Output", "3_Archive", "4_Errors")) {
            New-Item -ItemType Directory -Force -Path "$release/POD_System/$dir" | Out-Null
          }
          Compress-Archive -Path $release -DestinationPath release/POD_Splitter-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: POD_Splitter-Windows
          path: release/POD_Splitter-Windows.zip
          retention-days: 90

      - name: Upload to release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/POD_Splitter-Windows.zip
          generate_release_notes: true
